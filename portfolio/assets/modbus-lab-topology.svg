<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="mod-title mod-desc">
<title id="mod-title">Schneider M221 to PowerLogic PM5110 Modbus RTU architecture</title>
<desc id="mod-desc">The Schneider M221 acts as Modbus master over RS-485 and reads seven clock registers from a PowerLogic PM5110, stores them in PLC memory, and verifies them in Machine Expert Basic.</desc>
<style>
.bg{fill:#0b0910}.zone{fill:#f4f0f5;fill-opacity:.025;stroke:#f4f0f5;stroke-opacity:.10;stroke-width:.8}.mask{fill:#0b0910}.z,.tag,.edge{font:500 9px ui-monospace,monospace;letter-spacing:.12em}.z{fill:#817887}.tag{fill:#e7a2cf}.name{fill:#f4f0f5;font:600 15px system-ui,sans-serif}.sub{fill:#b5adb9;font:400 11px ui-monospace,monospace}.node{fill:#121018;stroke:#f4f0f5;stroke-opacity:.24}.focal{fill:#e7a2cf;fill-opacity:.09;stroke:#e7a2cf}.store{fill:#f4f0f5;fill-opacity:.04;stroke:#b5adb9}.wire{fill:none;stroke:#b5adb9;stroke-width:1.2}.wireA{fill:none;stroke:#e7a2cf;stroke-width:1.4}.ret{fill:none;stroke:#817887;stroke-width:1;stroke-dasharray:4 3}.edge{fill:#817887}.edgeA{fill:#e7a2cf}.step{opacity:0;transform:translateY(7px);animation:r .48s cubic-bezier(.2,.8,.2,1) forwards}.s1{animation-delay:.08s}.s2{animation-delay:.18s}.s3{animation-delay:.30s}.s4{animation-delay:.42s}.line{stroke-dasharray:1;stroke-dashoffset:1;animation:d .65s ease forwards}.l1{animation-delay:.18s}.l2{animation-delay:.34s}.l3{animation-delay:.48s}@keyframes r{to{opacity:1;transform:none}}@keyframes d{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.step{opacity:1;transform:none;animation:none}.line{stroke-dasharray:none;stroke-dashoffset:0;animation:none}}
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#f4f0f5" fill-opacity=".12"/></pattern><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#b5adb9"/></marker><marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#e7a2cf"/></marker></defs>
<rect class="bg" width="1000" height="500"/><rect width="1000" height="500" fill="url(#dots)" opacity=".45"/>
<text x="40" y="42" class="z">ARCHITECTURE · INDUSTRIAL NETWORKING</text><text x="40" y="76" fill="#f4f0f5" font-family="Georgia,serif" font-size="28">Modbus RTU register-read path</text><line x1="40" y1="98" x2="960" y2="98" stroke="#f4f0f5" stroke-opacity=".12"/>
<rect x="38" y="128" width="330" height="260" rx="8" class="zone"/><rect x="60" y="124" width="70" height="16" class="mask"/><text x="95" y="136" text-anchor="middle" class="z">FIELD</text>
<rect x="394" y="128" width="568" height="260" rx="8" class="zone"/><rect x="416" y="124" width="116" height="16" class="mask"/><text x="474" y="136" text-anchor="middle" class="z">CONTROL / ENGINEERING</text>
<path pathLength="1" class="wireA line l1" d="M292 244 H430" marker-end="url(#aa)"/><path pathLength="1" class="wire line l2" d="M620 244 H690" marker-end="url(#a)"/><path pathLength="1" class="wire line l3" d="M812 244 H862" marker-end="url(#a)"/><path pathLength="1" class="ret line l2" d="M430 292 H292" marker-end="url(#a)"/>
<text x="323" y="230" class="edgeA edge">RS-485 · 19200 · EVEN</text><text x="323" y="307" class="edge">7 WORD RESPONSE</text><text x="635" y="230" class="edge">%MW100…%MW106</text><text x="817" y="230" class="edge">VERIFY</text>
<g class="step s1"><rect x="86" y="196" width="206" height="112" rx="6" class="node"/><text x="98" y="214" class="tag">SLAVE · ID 1</text><text x="189" y="246" text-anchor="middle" class="name">PowerLogic PM5110</text><text x="189" y="267" text-anchor="middle" class="sub">clock register table</text><text x="189" y="285" text-anchor="middle" class="sub">entry 1837</text></g>
<g class="step s2"><rect x="430" y="184" width="190" height="124" rx="6" class="focal"/><text x="442" y="202" class="tag">MASTER · SL1</text><text x="525" y="238" text-anchor="middle" class="name">Schneider M221</text><text x="525" y="260" text-anchor="middle" class="sub">READ_VAR · function 0x03</text><text x="525" y="280" text-anchor="middle" class="sub">FirstObj = 1836</text></g>
<g class="step s3"><rect x="690" y="202" width="122" height="88" rx="6" class="store"/><text x="702" y="220" class="tag">STORE</text><text x="751" y="250" text-anchor="middle" class="name">PLC memory</text><text x="751" y="270" text-anchor="middle" class="sub">7 clock words</text></g>
<g class="step s4"><rect x="862" y="196" width="96" height="100" rx="6" class="node"/><text x="874" y="214" class="tag">HMI</text><text x="910" y="244" text-anchor="middle" class="name">Machine</text><text x="910" y="262" text-anchor="middle" class="name">Expert Basic</text><text x="910" y="281" text-anchor="middle" class="sub">animation table</text></g>
<rect x="430" y="332" width="382" height="38" rx="4" fill="#e7a2cf" fill-opacity=".06" stroke="#e7a2cf" stroke-opacity=".35"/><text x="446" y="348" class="tag">TROUBLESHOOTING</text><text x="570" y="356" fill="#b5adb9" font-family="system-ui,sans-serif" font-size="11">register-table 1837 required request offset 1836</text>
<line x1="40" y1="426" x2="960" y2="426" stroke="#f4f0f5" stroke-opacity=".12"/><text x="40" y="452" class="z">SEMANTICS</text><text x="118" y="452" fill="#b5adb9" font-family="system-ui,sans-serif" font-size="10">request → response → map → verify</text>
</svg>