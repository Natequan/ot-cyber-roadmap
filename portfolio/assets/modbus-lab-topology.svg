<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Modbus RTU laboratory topology</title>
  <desc id="desc">PowerLogic PM5110 communicates over RS-485 with a Schneider M221 PLC, which stores clock registers in memory and displays them in Machine Expert Basic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120d18"/><stop offset="1" stop-color="#09070d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8a4ff"/><stop offset="1" stop-color="#f2a8d8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c8a4ff"/></marker>
  </defs>
  <rect width="1280" height="540" rx="28" fill="url(#bg)"/>
  <text x="58" y="62" fill="#f5eefd" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Industrial Modbus RTU Lab</text>
  <text x="58" y="94" fill="#9e91a6" font-family="system-ui,sans-serif" font-size="16">Schneider M221 master ↔ PowerLogic PM5110 slave/server</text>
  <g font-family="system-ui,sans-serif">
    <rect x="55" y="165" width="290" height="176" rx="20" fill="#17111e" stroke="#60476d"/>
    <text x="82" y="208" fill="#f2a8d8" font-size="14" font-weight="700">ENERGY METER</text>
    <text x="82" y="246" fill="#f5eefd" font-size="24" font-weight="700">PowerLogic PM5110</text>
    <text x="82" y="280" fill="#b8aabc" font-size="15">Modbus address: 1</text>
    <text x="82" y="307" fill="#b8aabc" font-size="15">19200 bit/s · Even parity</text>

    <rect x="488" y="145" width="310" height="216" rx="20" fill="#17111e" stroke="#60476d"/>
    <text x="516" y="188" fill="#c8a4ff" font-size="14" font-weight="700">PLC / MASTER</text>
    <text x="516" y="226" fill="#f5eefd" font-size="24" font-weight="700">Schneider M221</text>
    <text x="516" y="260" fill="#b8aabc" font-size="15">Serial port: SL1</text>
    <text x="516" y="287" fill="#b8aabc" font-size="15">READ_VAR · Function 0x03</text>
    <text x="516" y="314" fill="#b8aabc" font-size="15">7 words → %MW100…%MW106</text>

    <rect x="928" y="165" width="300" height="176" rx="20" fill="#17111e" stroke="#60476d"/>
    <text x="956" y="208" fill="#f2a8d8" font-size="14" font-weight="700">VERIFICATION</text>
    <text x="956" y="246" fill="#f5eefd" font-size="22" font-weight="700">Machine Expert - Basic</text>
    <text x="956" y="280" fill="#b8aabc" font-size="15">Animation table</text>
    <text x="956" y="307" fill="#b8aabc" font-size="15">Date/time values verified</text>
  </g>

  <line x1="345" y1="253" x2="478" y2="253" stroke="url(#accent)" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)"/>
  <text x="374" y="222" fill="#d7cadb" font-family="ui-monospace,monospace" font-size="14">RS-485</text>
  <text x="361" y="289" fill="#918494" font-family="ui-monospace,monospace" font-size="13">D1 · D0 · Common</text>

  <line x1="798" y1="253" x2="918" y2="253" stroke="url(#accent)" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)"/>
  <text x="825" y="222" fill="#d7cadb" font-family="ui-monospace,monospace" font-size="14">PLC memory</text>
  <text x="811" y="289" fill="#918494" font-family="ui-monospace,monospace" font-size="13">%MW100…%MW106</text>

  <rect x="340" y="404" width="600" height="78" rx="16" fill="#100b15" stroke="#3c2d45"/>
  <text x="640" y="434" text-anchor="middle" fill="#f5eefd" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Troubleshooting highlight</text>
  <text x="640" y="459" text-anchor="middle" fill="#b8aabc" font-family="system-ui,sans-serif" font-size="14">FirstObj 1836 was required to retrieve register-table entry 1837 correctly.</text>
</svg>
