<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0912"/><stop offset="1" stop-color="#181020"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8a4ff"/><stop offset="1" stop-color="#f2a8d8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d8c6e8"/></marker>
    <style>.box{fill:#15101b;stroke:#584262;stroke-width:2;rx:18}.t{fill:#f7eff9;font:700 24px Arial,sans-serif}.s{fill:#b9aabd;font:500 16px Arial,sans-serif}.a{stroke:#d8c6e8;stroke-width:3;fill:none;marker-end:url(#arrow)}.tag{fill:url(#accent);font:700 14px Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <text x="60" y="65" class="t" font-size="30">Raspberry Pi Eye-Tracking Writing System</text>
  <text x="60" y="95" class="s">Computer vision → gaze coordinates → UDP → virtual keyboard → OLED feedback</text>

  <rect class="box" x="55" y="190" width="190" height="130"/>
  <text class="t" x="85" y="235">USB Camera</text><text class="s" x="85" y="268">GC0308</text><text class="s" x="85" y="294">Eye image frames</text>

  <rect class="box" x="330" y="150" width="260" height="210"/>
  <text class="t" x="365" y="195">Raspberry Pi</text><text class="s" x="365" y="228">OpenCV pupil detection</text><text class="s" x="365" y="255">CLAHE + blur + threshold</text><text class="s" x="365" y="282">Contour validation</text><text class="s" x="365" y="309">Kalman / weighted smoothing</text><text class="tag" x="365" y="340">EDGE PROCESSING</text>

  <rect class="box" x="690" y="155" width="240" height="200"/>
  <text class="t" x="725" y="200">Laptop</text><text class="s" x="725" y="233">UDP coordinates</text><text class="s" x="725" y="260">Calibration</text><text class="s" x="725" y="287">Virtual keyboard</text><text class="s" x="725" y="314">Letter selection</text>

  <rect class="box" x="1000" y="190" width="150" height="130"/>
  <text class="t" x="1032" y="235">OLED</text><text class="s" x="1022" y="268">128 × 64</text><text class="s" x="1022" y="294">Letter / word</text>

  <path class="a" d="M245 255 H330"/>
  <path class="a" d="M590 225 H690"/>
  <text class="s" x="607" y="208">UDP :5005</text>
  <path class="a" d="M690 310 H590"/>
  <text class="s" x="600" y="340">feedback :5006</text>
  <path class="a" d="M930 255 H1000"/>

  <rect x="330" y="425" width="600" height="62" rx="16" fill="#100c15" stroke="#3c2c44"/>
  <text class="s" x="365" y="463">Normalized gaze coordinates (x, y) are smoothed before transmission; OLED shows current letter, word buffer or tracking status.</text>
</svg>