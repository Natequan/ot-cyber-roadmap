    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="70" y="90" fill="#fff4f7" font-size="42" font-family="Arial" font-weight="700">Automated PCB Prototyping Cell</text>
