<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="pcb-title pcb-desc">
<title id="pcb-title">Automated PCB prototyping cell workflow</title>
<desc id="pcb-desc">A digital design moves through an Arduino CNC plotter, supervised chemical etching and verification. A parallel support-fabrication path produces enclosure and structural parts using 3D printing, laser processes and ShopBot machining.</desc>
<style>
.bg{fill:#0b0910}.z,.tag,.edge{font:500 9px ui-monospace,monospace;letter-spacing:.12em}.z{fill:#817887}.tag{fill:#e7a2cf}.name{fill:#f4f0f5;font:600 14px system-ui,sans-serif}.sub{fill:#b5adb9;font:400 10.5px ui-monospace,monospace}.node{fill:#121018;stroke:#f4f0f5;stroke-opacity:.22}.focal{fill:#e7a2cf;fill-opacity:.09;stroke:#e7a2cf}.soft{fill:#f4f0f5;fill-opacity:.025;stroke:#b5adb9;stroke-opacity:.45}.wire{fill:none;stroke:#b5adb9;stroke-width:1.15}.wireA{fill:none;stroke:#e7a2cf;stroke-width:1.35}.dash{fill:none;stroke:#817887;stroke-width:1;stroke-dasharray:4 3}.edge{fill:#817887}.step{opacity:0;transform:translateY(7px);animation:r .46s cubic-bezier(.2,.8,.2,1) forwards}.s1{animation-delay:.06s}.s2{animation-delay:.16s}.s3{animation-delay:.26s}.s4{animation-delay:.36s}.s5{animation-delay:.46s}.line{stroke-dasharray:1;stroke-dashoffset:1;animation:d .62s ease forwards}.l1{animation-delay:.18s}.l2{animation-delay:.30s}.l3{animation-delay:.42s}.l4{animation-delay:.54s}@keyframes r{to{opacity:1;transform:none}}@keyframes d{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.step{opacity:1;transform:none;animation:none}.line{stroke-dasharray:none;stroke-dashoffset:0;animation:none}}
</style>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#f4f0f5" fill-opacity=".12"/></pattern><marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#b5adb9"/></marker><marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#e7a2cf"/></marker></defs>
<rect class="bg" width="1000" height="520"/><rect width="1000" height="520" fill="url(#dots)" opacity=".45"/>
<text x="40" y="42" class="z">PROCESS · DIGITAL MANUFACTURING</text><text x="40" y="76" fill="#f4f0f5" font-family="Georgia,serif" font-size="28">Rapid PCB prototyping cell</text><line x1="40" y1="98" x2="960" y2="98" stroke="#f4f0f5" stroke-opacity=".12"/>

<path pathLength="1" class="wire line l1" d="M208 224 H262" marker-end="url(#a)"/><path pathLength="1" class="wireA line l2" d="M430 224 H490" marker-end="url(#aa)"/><path pathLength="1" class="wire line l3" d="M658 224 H718" marker-end="url(#a)"/><path pathLength="1" class="dash line l2" d="M124 270 V346 H332" marker-end="url(#a)"/><path pathLength="1" class="dash line l4" d="M542 386 H718 Q730 386 730 374 V310" marker-end="url(#a)"/>
<text x="215" y="210" class="edge">TOOLPATH</text><text x="438" y="210" class="tag">TRACE</text><text x="664" y="210" class="edge">ETCHED BOARD</text><text x="150" y="337" class="edge">CAD / STL</text><text x="566" y="377" class="edge">SUPPORT PARTS</text>

<g class="step s1"><rect x="52" y="178" width="156" height="92" rx="6" class="node"/><text x="64" y="196" class="tag">01 · DESIGN</text><text x="130" y="226" text-anchor="middle" class="name">Proteus + Fusion</text><text x="130" y="246" text-anchor="middle" class="sub">PCB · CAD/CAM</text></g>
<g class="step s2"><rect x="262" y="166" width="168" height="116" rx="6" class="focal"/><text x="274" y="184" class="tag">02 · MACHINE</text><text x="346" y="218" text-anchor="middle" class="name">Arduino CNC plotter</text><text x="346" y="239" text-anchor="middle" class="sub">NEMA 17 X/Y · SG90 Z</text><text x="346" y="258" text-anchor="middle" class="sub">Sharpie on copper</text></g>
<g class="step s3"><rect x="490" y="178" width="168" height="92" rx="6" class="node"/><text x="502" y="196" class="tag">03 · PROCESS</text><text x="574" y="226" text-anchor="middle" class="name">Supervised etching</text><text x="574" y="246" text-anchor="middle" class="sub">remove exposed copper</text></g>
<g class="step s4"><rect x="718" y="166" width="224" height="116" rx="6" class="node"/><text x="730" y="184" class="tag">04 · VERIFY</text><text x="830" y="218" text-anchor="middle" class="name">PCB prototype</text><text x="830" y="239" text-anchor="middle" class="sub">visible / defined traces</text><text x="830" y="258" text-anchor="middle" class="sub">15–20 min estimate</text></g>
<g class="step s5"><rect x="332" y="342" width="210" height="88" rx="6" class="soft"/><text x="344" y="360" class="tag">PARALLEL FABRICATION</text><text x="437" y="390" text-anchor="middle" class="name">Support parts</text><text x="437" y="410" text-anchor="middle" class="sub">PETG · laser · ShopBot</text></g>

<line x1="40" y1="462" x2="960" y2="462" stroke="#f4f0f5" stroke-opacity=".12"/><text x="40" y="488" class="z">PILOT METRICS</text><text x="150" y="488" fill="#b5adb9" font-family="system-ui,sans-serif" font-size="10">OEE 61.2% · prototype budget HNL 4,869.27 · break-even ≈ 18 PCBs</text>
</svg>